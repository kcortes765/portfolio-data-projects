services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: opsforge
      POSTGRES_PASSWORD: ${OPSFORGE_PGPASSWORD:?Set a local database password}
      POSTGRES_DB: postgres
    ports: ['127.0.0.1:55432:5432']
    volumes: [opsforge_pg:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsforge -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
  pipeline:
    build:
      context: ..
      dockerfile: opsforge/Dockerfile
    environment:
      OPSFORGE_DSN: postgresql://opsforge:${OPSFORGE_PGPASSWORD}@postgres:5432/postgres
      OPSFORGE_PGHOST: postgres
      OPSFORGE_PGPORT: '5432'
      OPSFORGE_PGPASSWORD: ${OPSFORGE_PGPASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  opsforge_pg:
